    <script>
        // =========================================================================
        // 全局工具函数：数位平方和分解与序列生成
        // =========================================================================
        function getDigitsBreakdown(n) {
            const digits = [];
            let temp = n;
            if (temp === 0) digits.push(0);
            while (temp > 0) {
                digits.unshift(temp % 10);
                temp = Math.floor(temp / 10);
            }
            const nextVal = digits.reduce((acc, d) => acc + d * d, 0);
            const formula = digits.map(d => `${d}²`).join(' + ') + ` = ${nextVal}`;
            return { digits, nextVal, formula };
        }

        function getNext(n) {
            let total = 0;
            while (n > 0) {
                const d = n % 10;
                total += d * d;
                n = Math.floor(n / 10);
            }
            return total;
        }

        // 生成完整隐式链表拓扑结构（柄部 + 环部）
        function analyzeTrajectory(startN) {
            const indexMap = new Map();
            const nodes = [];
            let curr = startN;
            while (!indexMap.has(curr)) {
                indexMap.set(curr, nodes.length);
                nodes.push(curr);
                curr = getNext(curr);
            }
            const cycleEntryIndex = indexMap.get(curr);
            const isHappy = (curr === 1);
            return {
                nodes,              // 唯一节点列表
                cycleEntryIndex,    // 入环口在 nodes 中的索引
                cycleEntryVal: curr,
                isHappy
            };
        }

        // 严格保持缩进的 Python 代码行渲染器
        function renderPythonLines(linesConfig, activeLineNums = [], highlightClass = 'active-line', clickableStateMap = null) {
            return linesConfig.map(line => {
                const isActive = activeLineNums.includes(line.num);
                const activeCls = isActive ? highlightClass : '';
                const clickAttr = clickableStateMap && clickableStateMap[line.num]
                    ? `onclick="selectCut7State(${clickableStateMap[line.num]})" style="cursor:pointer;"`
                    : '';

                // 计算前导空格数量，插入 4 空格缩进对齐虚线
                const rawIndent = line.indent || 0;
                let indentHtml = '';
                for (let i = 0; i < rawIndent; i += 4) {
                    indentHtml += `<span class="indent-guide">    </span>`;
                }

                return `<div class="code-line ${activeCls}" data-line="${line.num}" ${clickAttr}><span class="line-num">${line.num}</span><span class="code-content">${indentHtml}${line.html}</span></div>`;
            }).join('');
        }

        // 通用复制到剪贴板（兼容 iframe）
        function copyTextToClipboard(text, btnElement, successLabel = '✅ 已复制') {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const orig = btnElement.innerHTML;
                    btnElement.innerHTML = successLabel;
                    setTimeout(() => { btnElement.innerHTML = orig; }, 1600);
                }
            } catch (e) {}
            document.body.removeChild(textarea);
        }

        // =========================================================================
        // 顶部主模式切换（八刀向导 vs 三阶段沙盒）
        // =========================================================================
        let currentMainMode = 'cuts';

        function switchMainMode(mode) {
            currentMainMode = mode;
            const viewCuts = document.getElementById('view-cuts');
            const viewSandbox = document.getElementById('view-sandbox');
            const btnCuts = document.getElementById('btn-mode-cuts');
            const btnSandbox = document.getElementById('btn-mode-sandbox');

            if (mode === 'cuts') {
                viewCuts.classList.remove('hidden');
                viewSandbox.classList.add('hidden');
                btnCuts.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-1.5 bg-sky-500 text-slate-950 shadow-md';
                btnSandbox.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-1.5 text-slate-300 hover:text-white';
                renderCurrentCut();
            } else {
                viewCuts.classList.add('hidden');
                viewSandbox.classList.remove('hidden');
                btnSandbox.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-1.5 bg-sky-500 text-slate-950 shadow-md';
                btnCuts.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-1.5 text-slate-300 hover:text-white';
                sandboxPause();
                renderSandbox();
            }
        }

        // =========================================================================
        // 模式 1：八刀原子切片配置与状态管理
        // =========================================================================
        const CUTS_META = [
            { id: 0, short: '第 0 刀 · 隐式链表', title: '第 0 刀 · 拓扑破冰：没有 ListNode，哪来的链表？' },
            { id: 1, short: '第 1 刀 · 坍缩天花板', title: '第 1 刀 · 物理边界：为什么数字绝不会飙升到无穷大？' },

        // ==================== 第 3 刀：推进引擎 divmod(n, 10) 十进制剥皮机 ====================
        function initCut3Peeler(num) {
            cut3PeelerState = {
                orig: num,
                currN: num,
                total: 0,
                history: [],
                lastDigit: null,
                finished: false
            };
            renderCurrentCut();
        }

        function stepCut3Peeler() {
            if (cut3PeelerState.currN <= 0) {
                cut3PeelerState.finished = true;
                renderCurrentCut();
                return;
            }
            const d = cut3PeelerState.currN % 10;
            const nextN = Math.floor(cut3PeelerState.currN / 10);
            const sq = d * d;
            cut3PeelerState.total += sq;
            cut3PeelerState.lastDigit = d;
            cut3PeelerState.history.push({ prevN: cut3PeelerState.currN, nextN, digit: d, sq, runningTotal: cut3PeelerState.total });
            cut3PeelerState.currN = nextN;
            if (cut3PeelerState.currN === 0) {
                cut3PeelerState.finished = true;
            }
            renderCurrentCut();
        }

                { num: 2, indent: 4, html: `<span class="syn-var">total</span> = <span class="syn-num">0</span>` },
                { num: 3, indent: 4, html: `<span class="syn-kw">while</span> <span class="syn-var">n</span> > <span class="syn-num">0</span>:` },
                { num: 4, indent: 8, html: `<span class="syn-var">n</span>, <span class="syn-var">digit</span> = <span class="syn-fn">divmod</span>(<span class="syn-var">n</span>, <span class="syn-num">10</span>)  <span class="syn-cm"># 同时完成 n // 10 与 n % 10</span>` },
                { num: 5, indent: 8, html: `<span class="syn-var">total</span> += <span class="syn-var">digit</span> * <span class="syn-var">digit</span>     <span class="syn-cm"># 剥下的末位平方累加</span>` },
                { num: 6, indent: 4, html: `<span class="syn-kw">return</span> <span class="syn-var">total</span>` }
            ];

            let activeLines = [1, 2, 3];
            let hlClass = 'active-line';
            if (st.history.length > 0 && !st.finished) {
                activeLines = [3, 4, 5];
                hlClass = 'active-line-amber';

            const strDigits = String(st.currN > 0 ? st.currN : '').split('');

        function buildSandboxSteps(startVal, algo) {
            sbTrajectory = analyzeTrajectory(startVal);
            const steps = [];

            if (algo === 'floyd') {
                let slow = startVal;
                let fast = startVal;
                steps.push({
                    slow, fast,
                    activeLines: [9, 10],

                    calcSource: startVal,
                    msg: `初始化同一起跑线：slow = ${slow}, fast = ${fast}。检查 while fast != 1。`,
                    done: false
                });

                let round = 0;
                while (fast !== 1 && round < 40) {
                    round++;
                    const prevSlow = slow;
                    const prevFast = fast;
                    const midFast = getNext(fast);
                    slow = getNext(slow);
                    fast = getNext(midFast);

                    if (slow === fast && slow !== 1) {
                        steps.push({
                            slow, fast,
                            activeLines: [11, 12, 13, 14],
                            hlClass: 'active-line-rose',
                            calcSource: prevSlow,
                            fastTrace: `${prevFast} ➔ ${midFast} ➔ ${fast}`,
                            msg: `💥 第 ${round} 轮：slow 走到 ${slow}，fast 连迈两步 (${prevFast}➔${midFast}➔${fast})，在死循环圈内精准追尾 (slow == fast != 1)，返回 False！`,
                            done: true,
                            result: false
                        });
                        return steps;
                    }

                    steps.push({
                        slow, fast,
                        activeLines: [10, 11, 12, 13],
                        hlClass: fast === 1 ? 'active-line-emerald' : 'active-line-amber',
                        calcSource: prevSlow,
                        fastTrace: `${prevFast} ➔ ${midFast} ➔ ${fast}`,
                        msg: `第 ${round} 轮推进：slow 从 ${prevSlow} 走 1 步到 ${slow}；fast 从 ${prevFast} 连迈 2 步 (${prevFast}➔${midFast}➔${fast})。`,
                        done: false
                    });
                }

                steps.push({
                    slow, fast,
                    activeLines: [10, 15],
                    hlClass: 'active-line-emerald',
                    calcSource: fast,
                    msg: `🎯 终局判定：fast == 1，跳出 while 循环，抵达第 15 行直接返回 True（快乐数）！`,
                    done: true,
                    result: true

            } else if (algo === 'hash') {
                let curr = startVal;

                steps.push({
                    curr, seen: [...seen],

                    calcSource: curr,
                    msg: `初始化空集合 seen = set()，当前 n = ${curr}。`,

                let round = 0;
                while (curr !== 1 && !seen.includes(curr) && round < 40) {

                        curr, seen: [...seen],
                        activeLines: [4, 5, 6],
                        hlClass: 'active-line-amber',
                        calcSource: prev,
                        msg: `第 ${round} 步：将 ${prev} 存入 seen 印章池，计算 n = get_next(${prev}) = ${curr}。`,
                        done: false

                const isHappy = curr === 1;

                    activeLines: [4, 7],

                    msg: isHappy

                        : `💥 终局判定：n = ${curr} 已存在于 seen 集合中，拦截死循环，返回 n == 1 (False)！`,
                    done: true,
                    result: isHappy

                const isHappy = (tmp_sum === 1 || tmp_sum === 7);
                steps.push({

        function renderSandboxSVG(curStep) {
            const svg = document.getElementById('sb-svg-canvas');
            const { nodes, cycleEntryIndex, isHappy } = sbTrajectory;

            const coords = [];
            if (isHappy) {
                const total = nodes.length;
                const cols = Math.min(total, 5);
                nodes.forEach((val, idx) => {
                    const row = Math.floor(idx / cols);
                    const colInRow = idx % cols;
                    const actualCol = (row % 2 === 1) ? (cols - 1 - colInRow) : colInRow;
                    const x = 95 + actualCol * (490 / Math.max(1, cols - 1));
                    const y = total <= 5 ? 170 : (95 + row * 135);
                    coords.push({ val, x: total === 1 ? 340 : x, y });
                });
            } else {
                const stemNodes = nodes.slice(0, cycleEntryIndex);
                const cycleNodes = nodes.slice(cycleEntryIndex);
                const cx = 465, cy = 170, r = 105;

                const stemCount = stemNodes.length;
                stemNodes.forEach((val, idx) => {
                    const x = 55 + (idx * Math.min(72, 260 / Math.max(1, stemCount)));
                    const y = 170;
                    coords.push({ val, x, y, isStem: true });
                });

                cycleNodes.forEach((val, idx) => {
                    const angle = Math.PI - (idx * 2 * Math.PI) / cycleNodes.length;
                    const x = +(cx + r * Math.cos(angle)).toFixed(1);
                    const y = +(cy - r * Math.sin(angle)).toFixed(1);
                    coords.push({ val, x, y, isCycle: true });
                });
            }

            let edgesHtml = '';
            for (let i = 0; i < coords.length - 1; i++) {
                const a = coords[i];
                const b = coords[i + 1];
                edgesHtml += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#475569" stroke-width="2.2" marker-end="url(#sb-arrow)"/>`;
            }

            if (isHappy) {
                const last = coords[coords.length - 1];
                edgesHtml += `<path d="M ${last.x + 18} ${last.y - 15} C ${last.x + 55} ${last.y - 45}, ${last.x + 55} ${last.y + 45}, ${last.x + 18} ${last.y + 15}" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#sb-arrow-green)"/>`;
            } else {
                const last = coords[coords.length - 1];
                const entry = coords[cycleEntryIndex];
                edgesHtml += `<line x1="${last.x}" y1="${last.y}" x2="${entry.x}" y2="${entry.y}" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#sb-arrow-red)"/>`;
            }

            const nodesHtml = coords.map((nd, idx) => {
                let hasSlow = false, hasFast = false, inSeen = false;
                if (sbAlgo === 'floyd') {
                    hasSlow = curStep.slow === nd.val;
                    hasFast = curStep.fast === nd.val;
                } else {
                    hasSlow = curStep.curr === nd.val;
                    inSeen = curStep.seen.includes(nd.val);
                }

                const collided = sbAlgo === 'floyd' && hasSlow && hasFast && sbStepIdx > 0 && nd.val !== 1;
                let stroke = '#475569';
                let fill = '#0f172a';
                if (nd.val === 1) {
                    stroke = '#34d399';
                    fill = '#064e3b';
                } else if (collided) {
                    stroke = '#fb7185';
                    fill = '#881337';
                } else if (hasFast) {
                    stroke = '#fb923c';
                } else if (hasSlow) {
                    stroke = '#38bdf8';
                } else if (inSeen) {
                    stroke = '#a855f7';
                }

                return `
                <g transform="translate(${nd.x},${nd.y})" class="node-transition">
                    <circle r="21" fill="${fill}" stroke="${stroke}" stroke-width="2.8"/>
                    <text y="4" fill="#f8fafc" font-size="11.5" font-weight="bold" font-family="JetBrains Mono" text-anchor="middle">${nd.val}</text>
                    ${idx === 0 ? `<text y="-28" fill="#94a3b8" font-size="10" font-family="JetBrains Mono" text-anchor="middle">🚩起点</text>` : ''}
                    ${hasSlow ? `<g transform="translate(0, -34)"><rect x="-28" y="-10" width="56" height="17" rx="4" fill="#0284c7"/><text y="2" fill="#fff" font-size="9.5" font-weight="bold" text-anchor="middle">${sbAlgo === 'floyd' ? '🐢slow' : '📍curr'}</text></g>` : ''}
                    ${hasFast ? `<g transform="translate(0, 34)"><rect x="-28" y="-10" width="56" height="17" rx="4" fill="#ea580c"/><text y="2" fill="#fff" font-size="9.5" font-weight="bold" text-anchor="middle">🐇fast</text></g>` : ''}
                </g>`;
            }).join('');

            svg.innerHTML = `
                <defs>
                    <marker id="sb-arrow" viewBox="0 0 10 10" refX="25" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"></path>
                    </marker>
                    <marker id="sb-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"></path>
                    </marker>
                    <marker id="sb-arrow-red" viewBox="0 0 10 10" refX="25" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185"></path>
                    </marker>
                </defs>
                ${edgesHtml}
                ${nodesHtml}
            `;
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            if (currentMainMode === 'cuts') {
                if (e.key === 'ArrowLeft') stepCut(-1);
                if (e.key === 'ArrowRight') stepCut(1);
            } else {
                if (e.key === 'ArrowLeft') sandboxStep(-1);
                if (e.key === 'ArrowRight') sandboxStep(1);
            }
        });

        window.onload = function () {
            renderCutNav();
            renderCurrentCut();
            sbSteps = buildSandboxSteps(sbStartN, sbAlgo);
        };
    </script>
</body>
</html>
